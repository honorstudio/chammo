<!doctype html>
<html>
  <head><meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" /><title>inbox cards e2e</title>
  <script>
    // Tauri 대신 — 부른 명령을 적고, 결제 카드 답은 그 카드를 목록에서 뺀다(진짜처럼 답하면 카드가 사라짐)
    window.__calls = [];
    window.__TAURI_INTERNALS__ = { transformCallback: () => 0, invoke: async (cmd, args) => { window.__calls.push({ cmd, args, at: performance.now() }); if (cmd === 'direct_answer') window.__drop?.(args.id); return null; } };
  </script></head>
  <body style="margin:0"><div id="root"></div><script type="module" src="./main.tsx"></script></body>
</html>
