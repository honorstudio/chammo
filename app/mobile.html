    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
    <title>참모</title>
    <!-- 첫 그림 — JS 가 오기 전부터 보이는 파란 모찌(홈 화면 시작 그림과 같은 자리·크기·색). 앱이 첫 화면을 받으면 걷는다(ui/mobile/bootSplash).
         예전엔 JS(565KB)가 온 뒤에야 모찌가 나오고 2.5초에 걷혀 '불러오는 중…' 글자 화면이 떴다(2026-10-04 사용자 LTE). 폰 서버 CSP 가 인라인 스크립트를 막으니 그림·스타일만 -->
    <style>
      html { background: #f6f6f8; }
      #boot-splash { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; background: #f6f6f8; opacity: 1; transition: opacity .15s ease; }
      #boot-splash.out { opacity: 0; pointer-events: none; }
      #boot-splash svg { width: 96px; height: 96px; animation: boot-breathe 1.6s ease-in-out infinite; }
      @keyframes boot-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
      @media (prefers-color-scheme: dark) { html, #boot-splash { background: #151518; } }
      @media (prefers-reduced-motion: reduce) { #boot-splash svg { animation: none; } #boot-splash { transition: none; } }
    </style>
  </head>
  <body>
    <div id="boot-splash" role="status" aria-label="여는 중"><svg viewBox="0 0 40 40" aria-hidden="true"><path fill="#2f74e0" d="M20 7C27 7 31 11.5 32.2 17.5C33.2 22.5 36.5 25 36 29C35.4 33.5 29 34.5 20 34.5C11 34.5 4.6 33.5 4 29C3.5 25 6.8 22.5 7.8 17.5C9 11.5 13 7 20 7Z"/><ellipse fill="#fff" cx="13.7" cy="22.5" rx="2.29" ry="3.33"/><ellipse fill="#fff" cx="26.3" cy="22.5" rx="2.29" ry="3.33"/></svg></div>
    <div id="root"></div>
    <script type="module" src="/src/mobile.tsx"></script>
  </body>
